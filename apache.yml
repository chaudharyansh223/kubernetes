apiVersion: apps/v1
kind: Deployment
metadata: 
  name: apache
spec:
  replicas: 5
  selector:
    matchLabels:
      my: devops
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      name: pod-apache
      labels:
        my: devops
    spec:
      containers:
        - name: apache
          image: httpd
