apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apache-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chaudharyansh223/kubernetes.git
    targetRevision: main
    path: ./apache.yml
  destination:
    server: https://192.168.247.153:6443
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
