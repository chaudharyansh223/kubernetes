apiVersion: apps/v1
kind: Deployment
metadata: 
  name: argocd
spec:
  replicas: 3
  selector:
    matchLabels:
      my: app
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      name: pod-argo
      labels:
        my: app
    spec:
      containers:
        - name: nginx
          image: nginx
          imagePullPolicy: Never
